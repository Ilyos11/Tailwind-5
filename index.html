<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./src/output.css">
</head>
<body>

  <!-- Header -->
<header class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-100 max-w-7xl mx-auto">
  
  
  <div class="flex items-center space-x-2">
   
    <img src="Logo Telegram.png" alt="tocha logo" class="h-8 w-auto">
    
    <span class="text-xl font-bold text-gray-900">tocha</span>
  </div>

  
  <div class="flex items-center space-x-4">
  
    <a href="#" class="px-5 py-2 text-sm font-medium text-[#6366f1] bg-[#f5f3ff] rounded-lg hover:bg-[#ede9fe] transition-colors">
      Вход
    </a>
    
    
    <a href="#" class="px-5 py-2 text-sm font-medium text-white bg-[#6366f1] rounded-lg hover:bg-[#4f46e5] transition-colors shadow-sm">
      Регистрация
    </a>
  </div>

</header>


<!-- Section 2 -->
<section class="max-w-7xl mx-auto px-6 py-12 md:py-20 flex flex-col md:flex-row items-center justify-between gap-10">
  
  <div class="flex-1 text-center md:text-left">
    <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 leading-tight">
      <span class="text-[#6366f1]">Telegram чат</span> <br>
      на вашем сайте
    </h1>
    
    <p class="mt-6 text-lg text-gray-600 max-w-md mx-auto md:mx-0">
      Общение с клиентами станет простым и удобным, а подключение займет 5 минут. 
      <span class="font-semibold text-[#6366f1]">Первый месяц — бесплатно!</span>
    </p>

    <div class="mt-8">
      <button class="px-8 py-3 text-white font-medium bg-[#6366f1] rounded-lg shadow-lg shadow-indigo-200 hover:bg-[#4f46e5] transition-all transform hover:-translate-y-0.5">
        Подключить
      </button>
    </div>
  </div>


  <div class="flex-1 relative w-full flex justify-center md:justify-end">
   
    <div class="relative w-full max-w-[500px]">
      
       <img src="Telephone and message logo.png" alt="Hero illustration" class="w-full h-auto">
       
    </div>
  </div>

</section>







  
</body>
</html>
